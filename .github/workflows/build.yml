name: Build resumes and publish site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/xu-cheng/texlive-full:20250401

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install PDF validation tools
        run: apk add --no-cache poppler-utils poppler-data font-noto-cjk

      - name: Build and validate PDFs
        run: make validate

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v7
        with:
          name: resumes-${{ github.sha }}
          path: dist/*.pdf
          if-no-files-found: error
          retention-days: 90

  site-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate portfolio source
        run: bash ./scripts/validate-site.sh

  build-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, site-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download validated PDFs
        uses: actions/download-artifact@v8
        with:
          name: resumes-${{ github.sha }}
          path: dist

      - name: Prepare Markdown site
        run: ./scripts/build-site.sh

      - name: Validate portfolio source
        run: bash ./scripts/validate-site.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build GitHub Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: _site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
